name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── JOB 1: BUILD ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Salvar ambiente como artefato
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: |
            requirements.txt
            .
          retention-days: 1

  # ─── JOB 2A: TESTES ─────────────────────────────────────────────────────────
  testes:
    name: Testes
    runs-on: ubuntu-latest
    needs: build

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar cliente Prisma
        run: prisma generate

      - name: Rodar testes com pytest
        run: |
          pytest --tb=short -v

  # ─── JOB 2B: VERIFICAÇÃO ────────────────────────────────────────────────────
  verificacao:
    name: Verificação
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Verificar sintaxe e estilo (flake8)
        run: |
          # Para erros críticos de sintaxe (sempre falha)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Para avisos de estilo (não falha o pipeline)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ─── JOB 3: NOTIFICAÇÃO ─────────────────────────────────────────────────────
  notificacao:
    name: Notificação
    runs-on: ubuntu-latest
    needs: [testes, verificacao]
    if: always()

    steps:
      - name: Notificar resultado via e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [Los Geht's] Pipeline ${{ needs.testes.result == 'success' && needs.verificacao.result == 'success' && 'OK' || 'FALHOU' }} - ${{ github.ref_name }}
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Repositório : ${{ github.repository }}
            Branch      : ${{ github.ref_name }}
            Commit      : ${{ github.sha }}
            Autor       : ${{ github.actor }}

            Resultado dos jobs:
              - Build        : ${{ needs.build.result }}
              - Testes       : ${{ needs.testes.result }}
              - Verificacao  : ${{ needs.verificacao.result }}

            Veja o log completo em:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ─── JOB 4: DEPLOY ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [testes, verificacao]
    if: github.ref == 'refs/heads/main' && needs.testes.result == 'success' && needs.verificacao.result == 'success'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Deploy via webhook (Render / Railway)
        run: |
          curl -s --fail -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data '{"ref": "main"}' \
          && echo "Deploy disparado com sucesso!" \
          || (echo "Falha ao disparar o deploy." && exit 1)
